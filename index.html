<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Фавикон — два кружка знака на белом (npm run icons) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      media-src 'self' blob:;
      connect-src 'self' https://speller.yandex.net;
      frame-src blob: https://www.youtube.com https://docs.google.com https://www.figma.com;
      object-src 'none';
      base-uri 'self';
    " />
    <title>pechatniki</title>

    <!-- Тема и палитра — до первой отрисовки.
         Те же атрибуты ставит и React, но только после монтирования, и кадр
         между разбором CSS и первым рендером успевал показать базовую палитру:
         при выбранной «Некрасовской» страница на миг зеленела.
         Ключи и значения по умолчанию продублированы из App.jsx намеренно —
         модуль сюда не подключить, он выполняется уже после первого кадра.
         Значение не проверяем: неизвестная палитра не совпадёт ни с одним
         блоком [data-palette] и даст ту же базовую тему, которую через
         мгновение поставит и React. -->
    <script>
      try {
        var root = document.documentElement
        root.setAttribute('data-theme', localStorage.getItem('theme') || 'dark')
        root.setAttribute('data-palette', localStorage.getItem('pechatniki-palette') || 'forest')
        var width = localStorage.getItem('pechatniki-editor-width')
        if (width) root.style.setProperty('--editor-width', width + 'px')
      } catch (e) {
        /* приватный режим — обойдёмся значениями по умолчанию */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
